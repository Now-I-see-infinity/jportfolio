<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Decision — Prototype</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1>Decision — Task Board Prototype</h1>
      </header>

      <main>
        <section class="auth">
          <input id="email" placeholder="email" />
          <input id="password" type="password" placeholder="password" />
          <button id="btnRegister">Register</button>
          <button id="btnLogin">Login</button>
        </section>

        <section class="controls">
          <input id="projectName" placeholder="New project name" />
          <button id="btnCreateProject">Create Project</button>
          <select id="projects"></select>
        </section>

        <section class="board">
          <div class="column" data-status="todo">
            <h3>To Do</h3>
            <div class="list" id="col-todo"></div>
            <input id="new-todo" placeholder="New task title" />
            <button data-status="todo" class="btnAdd">Add</button>
          </div>
          <div class="column" data-status="inprogress">
            <h3>In Progress</h3>
            <div class="list" id="col-inprogress"></div>
            <input id="new-inprogress" placeholder="New task title" />
            <button data-status="inprogress" class="btnAdd">Add</button>
          </div>
          <div class="column" data-status="done">
            <h3>Done</h3>
            <div class="list" id="col-done"></div>
            <input id="new-done" placeholder="New task title" />
            <button data-status="done" class="btnAdd">Add</button>
          </div>
        </section>
      </main>

      <footer>
        <small>Prototype — stores data in server JSON file</small>
      </footer>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
